name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (unit, lifecycle, CLI, examples, README contract)
        run: npm test
      - name: This repository's own harness is consistent
        run: node bin/agent-harness.mjs check . --strict
      - name: Package contents
        run: npm pack --dry-run
